services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: web/backend/Dockerfile
    expose:
      - "8000"
    volumes:
      - babeldoc-storage:/app/file_storage
      - babeldoc-cache:/root/.cache/babeldoc
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  babeldoc-storage:
  babeldoc-cache:
